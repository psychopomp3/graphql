<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<h1>Mon Profil à moi que c'est le mien</h1>
	<button id="themeToggle" class="theme-toggle">🌗 Thème</button>

	<button id="logoutBtn">Logout</button>

	<div id="userInfo"></div>
	<div id="xpTotal"></div>

	<div class="card">
		<h2>XP Timeline</h2>
		<svg id="xpTimeline" width="100%" height="200"></svg>
	</div>

	<div class="card">
		<h2>Pass / Fail</h2>
		<select id="eventFilter">
			<option value="all">Tous les events</option>
			<option value="project">Projets</option>
			<option value="exercise">Exercices</option>
			<option value="piscine">Piscine</option>
			<option value="exam">Examens</option>
		</select>
		<svg id="passFailChart" width="200" height="200"></svg>
	</div>

	<div class="card">
		<h2>XP par projet</h2>
		<svg id="xpProjectsChart" width="100%" height="200"></svg>
	</div>

	<script type="module" src="./js/profile.js"></script>
</body>
</html>
