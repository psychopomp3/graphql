<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Space10 intra</title>

	<link rel="icon" href="./img/favicon.ico" type="image/x-icon">
	<!--<link rel="icon" type="image/png" href="./favicon.png">-->
	<link rel="icon" type="image/svg+xml" href="./img/space10-logo-indigo.svg">

	<link rel="stylesheet" href="./css/fonts.css">
	<link rel="stylesheet" href="./css/profile.css">
</head>
<body>
	<header>
		<h1 id="welcome"></h1>
		<button id="logoutBtn"><!--Logout--></button>
		<button id="themeToggle" class="theme-toggle"><!--🌗--></button>
	</header>

	<main>
		<div class="card">
			<div id="userInfo"></div>
			<div id="xpTotal"></div>
			<div id="audit"></div>
			<div id="skills"></div>
		</div>

		<div class="card">
			<h2>Pass/Fail by Events</h2>
			<div id="selectWrapper">
				<select id="eventFilter">
					<option value="all">All Events</option>
					<option value="project">Projects</option>
					<option value="exercise">Exercices</option>
					<option value="piscine">Piscines</option>
					<option value="exam">Exams</option>
				</select>
				<svg id="passFailChart" width="200" height="200"></svg>
			</div>
		</div>

		<div class="card">
			<h2>XP Timeline</h2>
			<svg id="xpTimeline" width="100%" height="200" viewBox="0 0 800 200"></svg>
		</div>

		<div class="card">
			<h2>XP by Project</h2>
			<svg id="xpProjectsChart" width="100%" height="200" viewBox="0 0 800 200"></svg>
		</div>
	</main>

	<script type="module" src="./js/profile.js"></script>
	<script type="module" src="./js/theme.js"></script>
</body>
</html>
